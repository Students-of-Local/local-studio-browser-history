# Builds a release and uploads it to the GitHub release for its tag:
#   tychicus-<version>-linux-x64.tar.gz, -darwin-arm64.tar.gz, -win-x64.zip: the `tychicus` program (CLI, MCP server
#     and native host, compiled by Bun) with extension/, plugins/ and LICENSE beside it
#   tychicus-<version>-extension.zip: the unpacked extension on its own
#   SHA256SUMS: one line per artifact
# Every artifact gets a build provenance attestation, so `tychicus install --release <folder>` (and anyone with gh)
# can check it was built here: gh attestation verify <file> --repo baney75/tychicus
#   --signer-workflow baney75/tychicus/.github/workflows/release.yml
# Runs on a pushed v* tag (release.sh pushes one), or by hand for an existing tag:
#   gh workflow run release.yml -f tag=v1.2.3
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build and upload, such as v1.2.3
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the attestations
      attestations: write # store them
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # The tag names the version the files carry; a mismatch would publish files under the wrong name.
      - name: The tag matches the version
        run: |
          version=$(node -p 'require("./static/manifest.chrome.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match static/manifest.chrome.json version $version."
            exit 1
          fi

      - name: Check out the pinned siblings and install
        run: ./scripts/setup-siblings.sh

      - name: Build
        env:
          TABKYRA_NO_BUMP: "1"
        run: |
          npm run build
          (cd cli && npm run build)

      # build-info.json says "dirty" when a tracked file differs from the tag. A release is the tag as it is, so a step
      # that changes one (setup-siblings' npm install once rewrote package-lock.json) fails here instead of shipping.
      - name: The build left the tag's files unchanged
        run: |
          node scripts/build-info.mjs
          changed=$(git status --porcelain --untracked-files=no)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::A release step changed tracked files, so build-info.json says dirty."
            exit 1
          fi

      # The plugins and their skills carry the version (scripts/plugin-version.mjs); the test fails when they drift.
      - name: The plugins carry the release version
        working-directory: cli
        run: node --test test/local-studio-plugins.test.mjs

      - name: Package every target
        run: node scripts/package-release.mjs --out release --targets linux-x64,darwin-arm64,win-x64

      # The Linux program from the archive answers with the tag's version, and the sums check.
      - name: Check the packaged files
        working-directory: release
        run: |
          sha256sum -c SHA256SUMS
          mkdir smoke
          tar -xzf "tychicus-${TAG#v}-linux-x64.tar.gz" -C smoke
          test "$(smoke/tychicus-${TAG#v}-linux-x64/tychicus --version)" = "${TAG#v}"
          rm -rf smoke

      - name: Attest every artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/tychicus-*.tar.gz
            release/tychicus-*.zip
            release/SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Tychicus ${TAG#v}" --notes "See CHANGELOG.md for what changed. Install: README.md, Install from a release."
          fi
          gh release upload "$TAG" release/tychicus-* release/SHA256SUMS --clobber
