# Local Studio plugin (v0): skills, a prompt and the /browse command. The tools come from the Tychicus MCP server,
# which `tychicus install --local-studio` registers in Eukhe's mcpServers setting. No capabilities yet: Local
# Studio refuses any until its consent sheet exists. The version is the release's (scripts/plugin-version.mjs).
id = "tychicus-browser"
version = "1.4.1"
description = "Work in Chromium tabs in the background through the Tychicus extension."
skills = "skills"
prompts = "prompts"
capabilities = []

[[commands]]
name = "browse"
description = "Do a task in a browser tab"
skill = "tychicus-browser"
